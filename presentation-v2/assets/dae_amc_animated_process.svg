<svg width="1000" height="500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Glow Filters -->
    <filter id="neon-blue" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="neon-green" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="neon-purple" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Gradients -->
    <linearGradient id="grad-box" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1e1e1e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2d2d2d;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Dark Background -->
  <rect width="100%" height="100%" fill="#0a0a0a"/>
  
  <!-- Grid Background -->
  <pattern id="smallGrid" width="20" height="20" patternUnits="userSpaceOnUse">
    <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#1a1a1a" stroke-width="1"/>
  </pattern>
  <rect width="100%" height="100%" fill="url(#smallGrid)"/>

  <!-- Connecting Lines (Pipes) -->
  <path d="M 130,250 L 200,250" stroke="#333" stroke-width="4"/> <!-- Input -> Enc -->
  <path d="M 300,250 L 350,250" stroke="#333" stroke-width="4"/> <!-- Enc -> BN -->
  <path d="M 410,250 L 460,250" stroke="#333" stroke-width="4"/> <!-- BN -> Dec -->
  <path d="M 560,250 L 630,250" stroke="#333" stroke-width="4"/> <!-- Dec -> Clean -->
  <path d="M 730,250 L 800,250" stroke="#333" stroke-width="4"/> <!-- Clean -> AMC -->
  <path d="M 900,250 L 950,250" stroke="#333" stroke-width="4"/> <!-- AMC -> Out -->

  <!-- ==================== STAGE 1: DAE ==================== -->
  
  <!-- Input Signal Box -->
  <g transform="translate(30, 220)">
    <rect width="100" height="60" rx="5" fill="#111" stroke="#ff5252" stroke-width="2"/>
    <text x="50" y="25" font-family="monospace" font-size="12" fill="#ff5252" text-anchor="middle">INPUT</text>
    <!-- Noisy Waveform -->
    <path d="M 10,40 L 20,30 L 30,50 L 40,35 L 50,45 L 60,30 L 70,50 L 80,40 L 90,40" fill="none" stroke="#ff5252" stroke-width="1.5"/>
  </g>

  <!-- Encoder -->
  <g transform="translate(200, 200)">
    <polygon points="0,0 100,20 100,80 0,100" fill="url(#grad-box)" stroke="#2979ff" stroke-width="2" filter="url(#neon-blue)"/>
    <text x="40" y="55" font-family="sans-serif" font-size="14" fill="#2979ff" text-anchor="middle" font-weight="bold">ENC</text>
  </g>

  <!-- Bottleneck -->
  <g transform="translate(350, 220)">
    <rect width="60" height="60" rx="5" fill="#111" stroke="#aa00ff" stroke-width="2" stroke-dasharray="5,5" filter="url(#neon-purple)">
      <animate attributeName="stroke-dashoffset" from="0" to="20" dur="1s" repeatCount="indefinite"/>
    </rect>
    <text x="30" y="35" font-family="monospace" font-size="10" fill="#e040fb" text-anchor="middle">128-dim</text>
  </g>

  <!-- Decoder -->
  <g transform="translate(460, 200)">
    <polygon points="0,20 100,0 100,100 0,80" fill="url(#grad-box)" stroke="#2979ff" stroke-width="2" filter="url(#neon-blue)"/>
    <text x="60" y="55" font-family="sans-serif" font-size="14" fill="#2979ff" text-anchor="middle" font-weight="bold">DEC</text>
  </g>

  <!-- Clean Signal Interface -->
  <g transform="translate(630, 220)">
    <rect width="100" height="60" rx="5" fill="#111" stroke="#00e5ff" stroke-width="2"/>
    <text x="50" y="25" font-family="monospace" font-size="12" fill="#00e5ff" text-anchor="middle">CLEAN</text>
    <!-- Clean Waveform -->
    <path d="M 10,40 Q 30,20 50,40 T 90,40" fill="none" stroke="#00e5ff" stroke-width="2"/>
  </g>

  <!-- ==================== STAGE 2: AMC ==================== -->

  <!-- CNN Classifier -->
  <g transform="translate(800, 190)">
    <rect width="100" height="120" rx="8" fill="url(#grad-box)" stroke="#00e676" stroke-width="2" filter="url(#neon-green)"/>
    <text x="50" y="30" font-family="sans-serif" font-size="14" fill="#00e676" text-anchor="middle" font-weight="bold">AMC</text>
    
    <!-- Internal Layers -->
    <rect x="15" y="45" width="70" height="10" rx="2" fill="#004d40"/>
    <rect x="15" y="60" width="70" height="10" rx="2" fill="#004d40"/>
    <rect x="15" y="75" width="70" height="10" rx="2" fill="#ffab00"/> <!-- SE Block -->
    <rect x="15" y="90" width="70" height="10" rx="2" fill="#004d40"/>
    
    <text x="50" y="84" font-family="monospace" font-size="8" fill="#ffab00" text-anchor="middle">SE-Block</text>
  </g>

  <!-- Output Class -->
  <g transform="translate(950, 225)">
    <rect width="40" height="50" rx="5" fill="#111" stroke="#00e676" stroke-width="1"/>
    <style>
      .label-text { font-family: monospace; font-size: 14px; fill: #00e676; text-anchor: middle; opacity: 0; animation: cycleLabels 3s infinite; }
      .label-1 { animation-delay: 0s; }
      .label-2 { animation-delay: 1s; }
      .label-3 { animation-delay: 2s; }
      @keyframes cycleLabels {
        0%, 33% { opacity: 1; }
        33.1%, 100% { opacity: 0; }
      }
    </style>
    <!-- Oscillating Output Text -->
    <g>
      <text x="20" y="30" class="label-text label-1">QPSK</text>
      <text x="20" y="30" class="label-text label-2">16QAM</text>
      <text x="20" y="30" class="label-text label-3">BPSK</text>
    </g>
  </g>

  <!-- ==================== ANIMATIONS (The Process) ==================== -->

  <!-- 1. Noisy Packet entering Encoder -->
  <circle r="6" fill="#ff5252">
    <animateMotion path="M 130,250 L 200,250" dur="3s" repeatCount="indefinite" begin="0s"/>
    <animate attributeName="opacity" values="1;0" dur="3s" repeatCount="indefinite" keyTimes="0;1"/>
  </circle>

  <!-- 2. Compressed Feature moving to Bottleneck -->
  <circle r="4" fill="#2979ff">
    <animateMotion path="M 300,250 L 350,250" dur="3s" repeatCount="indefinite" begin="1s"/>
    <animate attributeName="opacity" values="0;1;0" dur="3s" repeatCount="indefinite" keyTimes="0;0.5;1"/>
  </circle>

  <!-- 3. Feature moving to Decoder -->
  <circle r="4" fill="#e040fb">
    <animateMotion path="M 410,250 L 460,250" dur="3s" repeatCount="indefinite" begin="1.5s"/>
  </circle>

  <!-- 4. Clean Packet emerging -->
  <circle r="6" fill="#00e5ff">
    <animateMotion path="M 560,250 L 630,250" dur="3s" repeatCount="indefinite" begin="2s"/>
  </circle>

  <!-- 5. Clean Packet entering Classifier -->
  <circle r="6" fill="#00e5ff">
    <animateMotion path="M 730,250 L 800,250" dur="3s" repeatCount="indefinite" begin="2.5s"/>
  </circle>

  <!-- 6. Classification Result -->
  <circle r="6" fill="#00e676">
    <animateMotion path="M 900,250 L 950,250" dur="3s" repeatCount="indefinite" begin="3s"/>
    <animate attributeName="opacity" values="0;1" dur="3s" repeatCount="indefinite" keyTimes="0;1"/>
  </circle>

  <!-- Scanning Line Effect on Classifier -->
  <line x1="800" y1="190" x2="900" y2="190" stroke="#00e676" stroke-width="2" opacity="0.5">
    <animate attributeName="y1" values="190;310;190" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="y2" values="190;310;190" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0.8;0" dur="4s" repeatCount="indefinite"/>
  </line>

  <!-- Labels for Stages -->
  <text x="330" y="150" font-family="sans-serif" font-size="18" fill="#2979ff" text-anchor="middle" letter-spacing="2">SIGNAL DENOISING</text>
  <line x1="200" y1="160" x2="460" y2="160" stroke="#2979ff" stroke-width="1" opacity="0.5"/>

  <text x="850" y="150" font-family="sans-serif" font-size="18" fill="#00e676" text-anchor="middle" letter-spacing="2">CLASSIFICATION</text>
  <line x1="750" y1="160" x2="950" y2="160" stroke="#00e676" stroke-width="1" opacity="0.5"/>

</svg>
