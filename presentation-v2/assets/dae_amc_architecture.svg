<svg width="1000" height="400" xmlns="http://www.w3.org/2000/svg">
  <!-- Definitions for markers and gradients -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333"/>
    </marker>
    <linearGradient id="gradDAE" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#e3f2fd;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#bbdefb;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="gradAMC" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#e8f5e9;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#c8e6c9;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="white"/>

  <!-- Stage 1: DAE Container -->
  <rect x="50" y="50" width="400" height="300" rx="10" fill="none" stroke="#2196F3" stroke-width="2" stroke-dasharray="5,5"/>
  <text x="250" y="40" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#2196F3" text-anchor="middle">Stage 1: Signal Denoising (DAE)</text>

  <!-- Stage 2: AMC Container -->
  <rect x="550" y="50" width="400" height="300" rx="10" fill="none" stroke="#4CAF50" stroke-width="2" stroke-dasharray="5,5"/>
  <text x="750" y="40" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#4CAF50" text-anchor="middle">Stage 2: Classification (AMC)</text>

  <!-- Nodes -->
  <!-- Input -->
  <g transform="translate(80, 150)">
    <rect width="80" height="60" rx="5" fill="#fff" stroke="#333" stroke-width="1"/>
    <text x="40" y="35" font-family="Arial, sans-serif" font-size="12" text-anchor="middle">Noisy Input</text>
  </g>

  <!-- Encoder -->
  <g transform="translate(190, 130)">
    <polygon points="0,0 80,20 80,80 0,100" fill="url(#gradDAE)" stroke="#1976D2" stroke-width="1"/>
    <text x="40" y="55" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#0D47A1">Encoder</text>
  </g>

  <!-- Bottleneck -->
  <g transform="translate(280, 160)">
    <rect width="40" height="40" rx="5" fill="#1976D2" stroke="#0D47A1" stroke-width="1"/>
    <text x="20" y="25" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="white">128</text>
  </g>

  <!-- Decoder -->
  <g transform="translate(330, 130)">
    <polygon points="0,20 80,0 80,100 0,80" fill="url(#gradDAE)" stroke="#1976D2" stroke-width="1"/>
    <text x="40" y="55" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#0D47A1">Decoder</text>
  </g>

  <!-- Clean Signal (Interface) -->
  <g transform="translate(450, 150)">
    <rect width="100" height="60" rx="5" fill="#fff" stroke="#333" stroke-width="1"/>
    <text x="50" y="25" font-family="Arial, sans-serif" font-size="12" text-anchor="middle">Clean Signal</text>
    <path d="M10,40 Q25,30 50,40 T90,40" fill="none" stroke="#2196F3" stroke-width="2"/>
  </g>

  <!-- CNN Blocks -->
  <g transform="translate(580, 130)">
    <rect width="60" height="100" rx="5" fill="url(#gradAMC)" stroke="#388E3C" stroke-width="1"/>
    <text x="30" y="55" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#1B5E20">Conv1D</text>
  </g>

  <g transform="translate(660, 130)">
    <rect width="60" height="100" rx="5" fill="#FFECB3" stroke="#FFA000" stroke-width="1"/>
    <text x="30" y="55" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#E65100">SE Block</text>
  </g>

  <g transform="translate(740, 130)">
    <rect width="60" height="100" rx="5" fill="url(#gradAMC)" stroke="#388E3C" stroke-width="1"/>
    <text x="30" y="55" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#1B5E20">Conv1D</text>
  </g>

  <!-- Classifier Head -->
  <g transform="translate(820, 140)">
    <rect width="50" height="80" rx="5" fill="#E1BEE7" stroke="#8E24AA" stroke-width="1"/>
    <text x="25" y="45" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#4A148C">Dense</text>
  </g>

  <!-- Output -->
  <g transform="translate(900, 150)">
    <rect width="80" height="60" rx="5" fill="#fff" stroke="#333" stroke-width="1"/>
    <text x="40" y="25" font-family="Arial, sans-serif" font-size="12" text-anchor="middle">Class</text>
    <text x="40" y="45" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#666">BPSK/QPSK</text>
  </g>

  <!-- Arrows -->
  <line x1="160" y1="180" x2="190" y2="180" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="270" y1="180" x2="280" y2="180" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="320" y1="180" x2="330" y2="180" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="410" y1="180" x2="450" y2="180" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="550" y1="180" x2="580" y2="180" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="640" y1="180" x2="660" y2="180" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="720" y1="180" x2="740" y2="180" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="800" y1="180" x2="820" y2="180" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="870" y1="180" x2="900" y2="180" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>

</svg>
